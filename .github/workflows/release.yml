# talebook/candle-reader: Build + Release dist (only publish for tags; manual run picks the latest tag)
# Behaviour:
# - Triggered on tag push (refs/tags/v*) -> use that tag and create/upload release asset, also add 'latest' tag.
# - Triggered manually (workflow_dispatch) -> pick the latest tag in the repository (by semver-like sort),
#   and create/upload a release for that tag (if release already exists, upload asset to it).
#
# Notes:
# - Ensure repository Actions permissions allow writing releases, or set a RELEASE_PAT secret (repo scope)
#   and it will be used instead of the builtin GITHUB_TOKEN.
# - The release asset uploaded is ./dist.zip (your build must produce dist/).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

name: Build and release dist.zip (tag-only / manual latest-tag)

permissions:
  contents: write
  packages: write

env:
  ASSET_NAME: dist.zip
  OWNER: ${{ github.actor }}
  REPO: candle-reader

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fetch tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Archive dist
        run: |
          if [ -d dist ]; then
            rm -f ${ASSET_NAME}
            zip -r ${ASSET_NAME} dist
          else
            echo "dist directory not found"
            exit 1
          fi

      - name: Determine tag to use
        id: tag
        run: |
          set -e
          # If triggered by a tag push, use that tag
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##*/}"
            echo "Using tag from push: ${TAG}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise (workflow_dispatch), choose the latest tag available locally (sorted by version-like order)
          # ensure tags are fetched
          git fetch --tags --prune
          TAG=$(git tag --sort=-v:refname | head -n1 || true)
          if [ -z "$TAG" ]; then
            echo "No tags found in repository. Aborting."
            exit 1
          fi
          echo "Using latest tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create latest tag locally
        id: create_latest_tag
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          
          # Check if latest tag already exists locally
          if git rev-parse "refs/tags/latest" >/dev/null 2>&1; then
            echo "Latest tag already exists locally, will update it"
            # Delete local latest tag
            git tag -d latest || true
          fi
          
          # Create new latest tag pointing to current commit
          git tag latest "$(git rev-parse HEAD)"
          echo "Created local latest tag"

      - name: Push latest tag to remote
        run: |
          set -e
          # Push latest tag to remote (force push to update if exists)
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Release exists (get upload_url or create releases for both tags)
        id: ensure_release
        env:
          API_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          if [ -z "$API_TOKEN" ]; then
            echo "No token available in secrets.RELEASE_PAT or GITHUB_TOKEN. Aborting."
            exit 1
          fi

          echo "Processing release for main tag: '$TAG'"
          
          # Query release by main tag
          HTTP_STATUS=$(curl -s -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: token ${API_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${TAG}")

          if [ "$HTTP_STATUS" = "200" ]; then
            UPLOAD_URL=$(jq -r '.upload_url' /tmp/release.json)
            RELEASE_ID=$(jq -r '.id' /tmp/release.json)
            echo "Found existing release for ${TAG}"
            echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT
            echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          else
            if [ "$HTTP_STATUS" != "404" ]; then
              echo "Unexpected response when checking release: HTTP ${HTTP_STATUS}"
              cat /tmp/release.json || true
              exit 1
            fi

            echo "Release for ${TAG} not found. Creating a release..."
            # Create release for main tag
            CREATE_RESPONSE=$(curl -s -H "Authorization: token ${API_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              -X POST "https://api.github.com/repos/${OWNER}/${REPO}/releases" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":false}")

            # If API returned an error, show it
            echo "$CREATE_RESPONSE" > /tmp/create.json
            if echo "$CREATE_RESPONSE" | jq -e 'has("upload_url")' >/dev/null 2>&1; then
              UPLOAD_URL=$(jq -r '.upload_url' /tmp/create.json)
              RELEASE_ID=$(jq -r '.id' /tmp/create.json)
              echo "Created release for ${TAG}"
              echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT
              echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
            else
              echo "Failed to create release, response:"
              cat /tmp/create.json
              exit 1
            fi
          fi

          echo "Now updating latest tag to point to this release..."
          # Check if latest tag has a release
          LATEST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${API_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/latest")

          if [ "$LATEST_STATUS" = "200" ]; then
            # If latest release exists, update it to point to the same release ID
            # Actually, we just need to ensure latest tag points to the right commit
            # The release association will happen automatically since both tags point to same commit
            echo "Latest release already exists, it will now point to the same commit as ${TAG}"
          fi
          
          # Note: Since we pushed the latest tag above, GitHub will automatically
          # create a release for the latest tag if one doesn't exist.
          # If one exists, it will be updated to point to the new commit.

      - name: Upload dist.zip to Release (main tag)
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.ensure_release.outputs.upload_url }}
          asset_path: ./${{ env.ASSET_NAME }}
          asset_name: ${{ env.ASSET_NAME }}
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Upload dist.zip to Latest release (if separate release exists)
        id: upload_latest
        continue-on-error: true
        env:
          API_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
        run: |
          set -e
          # Check if latest tag has its own release (it usually does)
          LATEST_STATUS=$(curl -s -o /tmp/latest_release.json -w "%{http_code}" \
            -H "Authorization: token ${API_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/latest")

          if [ "$LATEST_STATUS" = "200" ]; then
            LATEST_UPLOAD_URL=$(jq -r '.upload_url' /tmp/latest_release.json)
            LATEST_RELEASE_ID=$(jq -r '.id' /tmp/latest_release.json)
            
            # Check if the latest release is different from the main tag release
            MAIN_RELEASE_ID="${{ steps.ensure_release.outputs.release_id }}"
            
            if [ "$LATEST_RELEASE_ID" != "$MAIN_RELEASE_ID" ]; then
              echo "Latest tag has a separate release (ID: $LATEST_RELEASE_ID), uploading asset to it too"
              # Upload asset to latest release
              curl -s -H "Authorization: token ${API_TOKEN}" \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Content-Type: application/zip" \
                --data-binary @"${{ env.ASSET_NAME }}" \
                "${LATEST_UPLOAD_URL%\{?name,label\}}?name=${{ env.ASSET_NAME }}" > /tmp/upload_result.json
              
              echo "Asset uploaded to latest release"
            else
              echo "Latest tag shares the same release as main tag, no need to upload twice"
            fi
          else
            echo "No separate release found for latest tag, skipping additional upload"
          fi
